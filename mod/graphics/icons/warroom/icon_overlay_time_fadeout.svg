<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Icon C (Fade-out variant): Top-left biggest & opaque -> bottom-right smallest & transparent -->
  <!-- 4th (Bottom-Right: Smallest, Most Transparent) -->
  <circle cx="50" cy="50" r="5.8"
          fill="#FFFFFF" fill-opacity="0.16"
          stroke="#FFFFFF" stroke-width="2.4" stroke-opacity="0.44" />
  <!-- 3rd (Lower-Mid Diagonal) -->
  <circle cx="41.5" cy="41.5" r="9.2"
          fill="#FFFFFF" fill-opacity="0.22"
          stroke="#FFFFFF" stroke-width="2.4" stroke-opacity="0.62" />
  <!-- 2nd (Upper-Mid Diagonal) -->
  <circle cx="32" cy="32" r="13"
          fill="#FFFFFF" fill-opacity="0.32"
          stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.82" />
  <!-- 1st (Top-Left: Biggest, Most Opaque) -->
  <circle cx="21" cy="21" r="17"
          fill="#FFFFFF" fill-opacity="0.48"
          stroke="#FFFFFF" stroke-width="2.6" stroke-opacity="1.00" />
</svg>
