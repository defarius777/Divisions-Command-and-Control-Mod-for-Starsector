<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Icon A: Firepower Overlay — Inverted firing-cone triangles originating from shared bottom origin (32,58) -->
  <!-- Outer Cone (Tallest & Widest Angle, Most Transparent — Sustained DoT long-range envelope) -->
  <polygon points="32,58 3,7 61,7"
           fill="#FFFFFF" fill-opacity="0.20"
           stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round" stroke-opacity="0.58" />
  <!-- Middle Cone (Medium Height & Width Angle, Medium Transparency — Short DoT 5s burst envelope) -->
  <polygon points="32,58 15,19 49,19"
           fill="#FFFFFF" fill-opacity="0.34"
           stroke="#FFFFFF" stroke-width="2.7" stroke-linejoin="round" stroke-opacity="0.82" />
  <!-- Inner Core Cone (Smallest & Narrowest Angle, Most Opaque — Alpha Strike core) -->
  <polygon points="32,58 25,31 39,31"
           fill="#FFFFFF" fill-opacity="0.95"
           stroke="#FFFFFF" stroke-width="2.8" stroke-linejoin="round" stroke-opacity="1.00" />
</svg>
