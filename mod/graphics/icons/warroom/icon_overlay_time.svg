<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Icon C: Time Overlay — Diagonally cascading circles of decreasing size and transparency (top-left to bottom-right) -->
  <!-- 1st (Top-Left: Biggest, Most Transparent) -->
  <circle cx="21" cy="21" r="17"
          fill="#FFFFFF" fill-opacity="0.18"
          stroke="#FFFFFF" stroke-width="2.6" stroke-opacity="0.56" />
  <!-- 2nd (Upper-Mid Diagonal) -->
  <circle cx="32" cy="32" r="13"
          fill="#FFFFFF" fill-opacity="0.28"
          stroke="#FFFFFF" stroke-width="2.6" stroke-opacity="0.74" />
  <!-- 3rd (Lower-Mid Diagonal) -->
  <circle cx="41.5" cy="41.5" r="9.2"
          fill="#FFFFFF" fill-opacity="0.44"
          stroke="#FFFFFF" stroke-width="2.7" stroke-opacity="0.90" />
  <!-- 4th (Bottom-Right: Smallest, Least Transparent / Most Opaque) -->
  <circle cx="50" cy="50" r="5.8"
          fill="#FFFFFF" fill-opacity="0.95"
          stroke="#FFFFFF" stroke-width="2.8" stroke-opacity="1.00" />
</svg>
